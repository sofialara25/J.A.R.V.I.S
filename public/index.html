<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="J.A.R.V.I.S. - asistente virtual con Google Gemini">
  <title>J.A.R.V.I.S.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="hud">

    <header class="hud-top">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-text">J.A.R.V.I.S.</span>
      </div>
      <div class="hud-status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">INICIANDO</span>
      </div>
    </header>

    <main class="hud-main">
      <!-- Reactor arc: pulsa mientras piensa o habla -->
      <div class="arc-reactor" id="reactor" title="Reactor arc">
        <div class="ring ring-outer"></div>
        <div class="ring ring-mid"></div>
        <div class="core"></div>
      </div>

      <div class="messages" id="messages" aria-live="polite"></div>
    </main>

    <footer class="hud-bottom">
      <div class="toolbar">
        <button type="button" class="btn" id="voiceBtn" title="Activar o desactivar la voz">VOZ: ON</button>
        <button type="button" class="btn" id="micBtn" title="Hablar por micrófono">MICRÓFONO</button>
        <button type="button" class="btn btn-danger" id="clearBtn" title="Limpiar la conversación">LIMPIAR</button>
      </div>

      <form class="composer" id="chatForm" autocomplete="off">
        <input type="text" id="input" placeholder="Hable con J.A.R.V.I.S., señora..." aria-label="Mensaje">
        <button type="submit" class="btn btn-primary" id="sendBtn">ENVIAR</button>
      </form>

      <div class="hint">Comandos locales: «¿qué hora es?», «¿qué fecha es?», «abre YouTube / Google / GitHub»</div>
    </footer>

  </div>
  <script src="app.js"></script>
</body>
</html>
